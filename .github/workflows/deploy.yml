name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    # Runs on a self-hosted runner on the NAS itself, since GitHub-hosted
    # runners can't reach hydrogen.local. The runner has access to the
    # host's Docker socket, so it builds and redeploys directly - no
    # registry or webhook needed.
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and deploy
        run: docker compose -p rdm -f docker-compose.yml up -d --build
