services:
  rdm:
    build: .
    container_name: rdm
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - ORIGIN=${ORIGIN:-http://localhost:3000}
      - SYNOLOGY_HOST=${SYNOLOGY_HOST}
      - SYNOLOGY_PORT=${SYNOLOGY_PORT:-5000}
      - SYNOLOGY_USERNAME=${SYNOLOGY_USERNAME}
      - SYNOLOGY_PASSWORD=${SYNOLOGY_PASSWORD}
      - SYNOLOGY_MOVIES_PATH=${SYNOLOGY_MOVIES_PATH}
      - SYNOLOGY_TV_PATH=${SYNOLOGY_TV_PATH}
